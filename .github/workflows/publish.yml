name: Publish npm + MCP registry

# WHY CI PUBLISH. npm now restricts legacy "bypass-2FA" tokens for direct publishing, so a local
# `npm publish` on a 2FA account can 403 ("forbidden by your security policy"). CI sidesteps that:
# the npm step uses a granular token stored as the NPM_TOKEN secret, and the MCP-registry step needs
# no npm token at all — it authenticates with GitHub OIDC, which also proves ownership of the
# `io.github.philpof102-svg/*` namespace in server.json. Every publish runs the full test suite first.
#
# One-time setup (maintainer): create a granular npm access token with publish rights for `lawbor-bot`
# at npmjs.com, add it as the repo secret NPM_TOKEN. Then push a tag `vX.Y.Z` (matching the versions
# in package.json AND server.json) to release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test + pack, no publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # required for the MCP registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # LAWBOR has ZERO runtime dependencies, so this installs nothing — it just primes npm.
      - name: Install deps
        run: npm install --no-audit --no-fund

      # The 137-check suite is the gate: a red build never publishes.
      - name: Run tests
        run: npm test

      # ⛔ L'ETAT D'AVANT, CAPTURE AVANT D'AGIR — sans lui, la garde d'honnetete plus bas ne peut pas
      # dire la verite. Mesure du 2026-08-17, dans l'etat verrouille du depot (0.2.1 publie le 21/07,
      # version locale AUSSI 0.2.1): `npm publish` rend E403, `continue-on-error` l'avale, puis la
      # garde demande `npm view lawbor-bot@0.2.1 version`, obtient « 0.2.1 » — parce que cette version
      # existe depuis un mois — et PASSE. Le run sortait VERT en n'ayant RIEN publie.
      #
      # La garde verifiait une PRESENCE la ou l'exigence est une TRANSITION: elle ne distinguait pas
      # « on vient de publier » de « ca existait deja ». C'est la meme faute que sonder l'EXISTENCE
      # d'un outil quand ce qu'on exige est sa CAPACITE. On enregistre donc l'avant, et chaque branche
      # dit ce qui s'est reellement passe.
      - name: npm — cette version est-elle deja publiee ?
        id: npmstate
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if npm view "lawbor-bot@$V" version >/dev/null 2>&1; then
            echo "deja publie sur npm: lawbor-bot@$V — l'etape publish sera sautee, le registre MCP tournera quand meme"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "absent de npm: lawbor-bot@$V — l'etape publish tournera"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Plus de `continue-on-error`: la condition remplace l'avalage. Quand npm DOIT tourner et
      # echoue, la release ne doit pas aboutir — sinon le registre annoncerait une version que npm ne
      # sert pas. Quand npm n'a rien a faire, l'etape est sautee et le registre continue: c'est
      # exactement ce que `continue-on-error` cherchait a obtenir, sans masquer les vrais echecs.
      - name: npm publish
        if: ${{ inputs.dry_run != 'true' && steps.npmstate.outputs.already != 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # THE HONESTY GATE. v0.2.1 taught this: with continue-on-error above, an ABSENT/dead NPM_TOKEN
      # made the npm step silently no-op — the run stayed green while npm never got the version (the
      # v0.2.0 "success" was actually validating a LOCAL publish). This step makes the pipeline unable
      # to lie: either npm serves exactly this version (retrying through registry propagation lag,
      # which also 404'd the MCP step once), or the run fails naming the real cause.
      # ⚠️ DEUX BRANCHES, PARCE QU'IL Y A DEUX MONDES, et les confondre est ce qui faisait mentir ce
      # portillon. « Cette version existait DEJA » n'est pas « on vient de la publier »: le premier
      # est une re-execution legitime (le registre MCP se rafraichit), le second est la vraie
      # publication. Le journal doit dire lequel, sinon un run vert se lit « expedié » alors que rien
      # n'a bouge chez les installateurs.
      # ⚠️ La valeur passe par `env:`, jamais interpolee DANS le `run:`. Une expression `${{ }}` est
      # substituee AVANT que bash ne voie la ligne: une valeur portant un guillemet casserait le
      # script (ou pire). Ici elle vaut « true »/« false » et vient de notre propre etape, donc le
      # risque est nul — mais c'est la forme recommandee, et aucun autre workflow de ces depots
      # n'avait de precedent d'interpolation dans un shell. On ne cree pas le precedent risque.
      - name: Verify npm actually has this version
        if: ${{ inputs.dry_run != 'true' }}
        env:
          DEJA_PUBLIE: ${{ steps.npmstate.outputs.already }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$DEJA_PUBLIE" = "true" ]; then
            echo "::notice::lawbor-bot@$V etait DEJA sur npm avant ce run — RIEN n'a ete publie."
            echo "Ce run rafraichit le registre MCP uniquement. Pour expedier du code aux"
            echo "installateurs, monter la version dans package.json (voir npm run test:publish)."
            exit 0
          fi
          for i in $(seq 1 12); do
            GOT=$(npm view lawbor-bot@"$V" version 2>/dev/null || true)
            if [ "$GOT" = "$V" ]; then echo "npm serves lawbor-bot@$V (publie par ce run)"; exit 0; fi
            echo "npm does not serve $V yet (attempt $i/12) — waiting 10s"; sleep 10
          done
          echo "::error::lawbor-bot@$V never appeared on npm — the publish step failed silently (is the NPM_TOKEN secret set? see the header of this file)"; exit 1

      - name: Install mcp-publisher
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: MCP login (GitHub OIDC)
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      # Reads server.json at the repo root. Its description is 96 chars (the registry caps it at 100 —
      # xsignal's first publish 422'd on a 243-char description, so this stays well under).
      - name: MCP publish
        if: ${{ inputs.dry_run != 'true' }}
        run: ./mcp-publisher publish
